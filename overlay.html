<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>수익 오버레이</title>

<!-- Firebase 8.x SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
    /* 프랭크 스타일 방송용 굵은 글씨체 */
    @import url('https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@500;700;900&display=swap');

    body {
        margin: 0;
        padding: 0;
        background: transparent;
        font-family: 'Noto Sans KR', -apple-system, 'Segoe UI', sans-serif;
        color: white;
    }

    /* 기존 오버레이와 동일한 스타일 */
    #overlay {
        position: fixed;
        bottom: 20px;
        right: 20px;
        display: flex;
        align-items: center;
        gap: 12px;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(8px);
        padding: 8px 18px;
        border-radius: 30px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.5);
        font-size: 15px;
        white-space: nowrap;
    }

    /* 수익 항목 공통 스타일 */
    #overlay span {
        margin: 0;
        display: inline-flex;
        align-items: center;
        gap: 4px;
    }

    /* 일 수익 - 초록색 */
    #dailyText {
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
    }

    /* 월 수익 - 파란색 */
    #weeklyText {
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
    }

    /* 년 수익 - 주황색 */
    #monthlyText {
        font-weight: 700;
        color: #ffffff;
        text-shadow: 0 2px 4px rgba(0, 0, 0, 0.75);
    }

    /* 툴팁 스타일 */
    [data-tooltip] {
        position: relative;
        cursor: help;
    }

    [data-tooltip]:hover::after {
        content: attr(data-tooltip);
        position: absolute;
        bottom: 30px;
        right: 0;
        background: rgba(0, 0, 0, 0.9);
        color: white;
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        white-space: nowrap;
        z-index: 10000;
        border: 1px solid rgba(255, 255, 255, 0.2);
    }
</style>
</head>

<body>
<div id="overlay">
    <span id="dailyText" data-tooltip="오늘 수익">💰 일 수익: -</span>
    <span id="weeklyText" data-tooltip="이번 달 수익">📊 월 수익: -</span>
    <span id="monthlyText" data-tooltip="올해 수익">📈 년 수익: -</span>
</div>

<script>
/**
 * Firebase 설정
 */
const firebaseConfig = {
    apiKey: "AIzaSyA5hMmN9QFgdFtaA5gicS_pj-blu_jJdvE",
    authDomain: "rider-bf48b.firebaseapp.com",
    databaseURL: "https://rider-bf48b-default-rtdb.firebaseio.com",
    projectId: "rider-bf48b",
    storageBucket: "rider-bf48b.firebasestorage.app",
    messagingSenderId: "1026929653322",
    appId: "1:1026929653322:web:b90541cccba5b4186198b3"
};

// Firebase 초기화
let db;
try {
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    console.log('🔥 Firebase 연결 성공');
} catch (error) {
    console.error('❌ Firebase 초기화 실패:', error);
}

/**
 * 숫자 포맷팅 (천 단위 콤마만 추가, '원' 제거)
 */
function formatNumber(value) {
    // 값이 없으면 '0' 반환
    if (!value && value !== 0) return '0';
    
    // 문자열에서 숫자만 추출
    const num = parseInt(value.toString().replace(/[^0-9]/g, ''));
    if (isNaN(num)) return value; // 숫자가 아니면 원본 반환
    
    // 천 단위 콤마만 추가 (원 제거)
    return num.toLocaleString();
}

// Firebase 데이터 수신
if (db) {
    db.ref('overlayData').on('value', (snapshot) => {
        const data = snapshot.val();
        if (!data) {
            console.log('📊 데이터 없음');
            return;
        }

        // 각 요소 업데이트 ('원' 제거됨)
        document.getElementById('dailyText').innerHTML = 
            `💰 일 수익: ${formatNumber(data.daily)}`;
        document.getElementById('weeklyText').innerHTML = 
            `📊 월 수익: ${formatNumber(data.weekly)}`;
        document.getElementById('monthlyText').innerHTML = 
            `📈 년 수익: ${formatNumber(data.monthly)}`;
        
        console.log('📊 수익 데이터 업데이트:', data);
    }, (error) => {
        console.error('❌ Firebase 데이터 로드 실패:', error);
    });
} else {
    // Firebase 연결 실패시 더미 데이터 표시 ('원' 제거)
    document.getElementById('dailyText').innerHTML = '💰 일 수익: 0';
    document.getElementById('weeklyText').innerHTML = '📊 월 수익: 0';
    document.getElementById('monthlyText').innerHTML = '📈 년 수익: 0';
}

console.log('✅ 수익 오버레이 로드 완료 (원 제거)');
</script>

</body>
</html>
