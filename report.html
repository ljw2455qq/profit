<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>수익 정산 (가계부)</title>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="firebase.js"></script>

<style>
body { font-family: 'Noto Sans KR', sans-serif; background: #1f1f1f; color: #fff; padding: 18px; }
h1 { font-size: 20px; text-align: center; }
.card { background: #2a2a2a; border-radius: 12px; padding: 16px; max-width: 720px; margin: 14px auto; }
.title { font-size: 16px; font-weight: 800; margin-bottom: 10px; }
.daily-t { color: #7ee0c0; } .month-t { color: #ffd166; } .year-t { color: #8ab4ff; }
.muted { color: #8a8a8a; font-size: 13px; line-height: 1.5; }

.cards { display: flex; gap: 12px; max-width: 720px; margin: 14px auto; flex-wrap: wrap; }
.scard { flex: 1; min-width: 150px; background: #2a2a2a; border-radius: 12px; padding: 14px; text-align: center; }
.scard .k { font-size: 13px; color: #aab2c0; }
.scard .v { font-size: 24px; font-weight: 800; margin-top: 4px; }
.scard .n { font-size: 12px; color: #cfd6e4; margin-top: 2px; }

table { width: 100%; border-collapse: collapse; margin-top: 6px; }
th, td { padding: 8px 6px; border-bottom: 1px solid #383838; font-size: 14px; text-align: right; }
th { color: #9aa3b2; font-weight: 700; font-size: 12px; }
th:first-child, td:first-child { text-align: left; }
td.center, th.center { text-align: center; }
input.edit { width: 110px; padding: 7px; font-size: 14px; text-align: right; border: none; border-radius: 6px; background: #f4f4f4; }
button { border: none; border-radius: 6px; cursor: pointer; font-size: 13px; padding: 7px 10px; color: #fff; }
.save { background: #16a085; } .save:hover { background: #138d75; }
.del { background: #c0392b; margin-left: 4px; } .del:hover { background: #a93226; }
.ovtag { font-size: 10px; color: #211400; background: #ffd166; padding: 1px 6px; border-radius: 999px; margin-left: 6px; }
.up { color: #34d399; font-weight: 700; } .down { color: #f87171; font-weight: 700; } .flat { color: #888; }

.addbox { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; padding-top: 10px; border-top: 1px dashed #444; }
.addbox input { padding: 8px; font-size: 14px; border: none; border-radius: 6px; }
.csvbtn { background: #2980b9; font-size: 14px; padding: 10px 16px; font-weight: 700; }
.csvbtn:hover { background: #2471a3; }

/* 막대 그래프 */
select { padding: 8px; border-radius: 6px; border: none; font-size: 14px; }
.chart { display: flex; align-items: flex-end; gap: 2px; height: 150px; margin-top: 12px; overflow-x: auto; padding-bottom: 4px; }
.bcol { display: flex; flex-direction: column; align-items: center; min-width: 13px; flex: 1; }
.bwrap { height: 124px; display: flex; align-items: flex-end; width: 100%; }
.bbar { width: 100%; background: linear-gradient(180deg, #7ee0c0, #16a085); border-radius: 3px 3px 0 0; min-height: 2px; }
.bday { font-size: 9px; color: #888; margin-top: 3px; }

#notice { display: none; max-width: 720px; margin: 10px auto; padding: 12px; border-radius: 8px; font-weight: 700; }
#notice.success { display: block; background: #1f7a3a; } #notice.error { display: block; background: #b33939; }
a.back { display: inline-block; color: #8ab4ff; text-decoration: none; font-size: 14px; }
#authGate { position: fixed; inset: 0; background: #1f1f1f; display: flex; flex-direction: column; gap: 10px; align-items: center; justify-content: center; z-index: 9999; }
#authGate input { width: 220px; padding: 10px; font-size: 16px; border: none; border-radius: 6px; }
#authGate button { background: #16a085; padding: 12px 24px; font-size: 16px; }
@media (max-width: 560px) { input.edit { width: 84px; } th, td { font-size: 13px; padding: 7px 4px; } }
</style>
</head>

<body>

<div id="authGate">
<div style="font-weight:700;font-size:18px;">🔒 로그인</div>
<input id="authEmail" type="email" placeholder="이메일">
<input id="authPw" type="password" placeholder="비밀번호">
<button onclick="doLogin()">로그인</button>
<div id="authMsg" style="color:#ff6b6b;font-size:13px;"></div>
</div>

<h1>📊 수익 정산 (가계부)</h1>
<div style="text-align:center"><a class="back" href="index.html">← 관리 페이지로</a></div>

<div id="notice"></div>

<div class="cards">
<div class="scard"><div class="k">📅 오늘</div><div class="v" id="cToday">0원</div><div class="n" id="cTodayNet">세후 0원</div></div>
<div class="scard"><div class="k">🗓️ 이번 달</div><div class="v" id="cMonth">0원</div><div class="n" id="cMonthNet">세후 0원</div></div>
<div class="scard"><div class="k">📈 올해</div><div class="v" id="cYear">0원</div><div class="n" id="cYearNet">세후 0원</div></div>
</div>

<!-- CSV -->
<div class="card">
<div class="title">💾 데이터 백업</div>
<button class="csvbtn" onclick="exportCSV()">📄 CSV 내보내기 (엑셀)</button>
<div class="muted" style="margin-top:8px">• 일별·월별·연별 기록 전체를 엑셀에서 열 수 있는 CSV 파일로 내려받습니다. (한글 깨짐 방지 처리됨)</div>
</div>

<!-- 월간 일별 그래프 -->
<div class="card">
<div class="title">📊 월간 일별 막대그래프</div>
<select id="chartMonth" onchange="renderChart(this.value)"></select>
<div id="chart" class="chart"></div>
<div class="muted" id="chartInfo" style="margin-top:6px"></div>
</div>

<!-- 일별 기록 -->
<div class="card">
<div class="title daily-t">📅 일별 기록</div>
<table id="dailyTable"><thead><tr><th>날짜</th><th>세전</th><th>세후</th><th class="center">관리</th></tr></thead><tbody id="dailyBody"></tbody></table>
<div class="addbox">
<input id="manualDate" type="date">
<input id="manualGross" type="text" inputmode="numeric" placeholder="세전 금액">
<button class="save" onclick="manualAdd()">일별 기록 추가</button>
</div>
</div>

<!-- 월별 기록 -->
<div class="card">
<div class="title month-t">🗓️ 월별 기록</div>
<table id="monthTable"><thead><tr><th>월</th><th>세전</th><th>세후</th><th class="center">전월대비</th><th class="center">관리</th></tr></thead><tbody id="monthBody"></tbody></table>
<div class="addbox">
<input id="addMonth" type="month">
<input id="addMonthGross" type="text" inputmode="numeric" placeholder="세전 금액">
<button class="save" onclick="addMonthRecord()">월별 기록 추가</button>
</div>
<div class="muted" style="margin-top:8px">• 일별 기록이 있는 달은 자동 합계가 표시됩니다. 값을 고쳐 저장하면 <span class="ovtag">수정됨</span>으로 덮어쓰며, <b>합계복원</b>으로 되돌립니다.</div>
</div>

<!-- 연별 기록 -->
<div class="card">
<div class="title year-t">📈 연별 기록</div>
<table id="yearTable"><thead><tr><th>연도</th><th>세전</th><th>세후</th><th class="center">관리</th></tr></thead><tbody id="yearBody"></tbody></table>
<div class="addbox">
<input id="addYear" type="number" placeholder="연도(예: 2025)" style="width:120px">
<input id="addYearGross" type="text" inputmode="numeric" placeholder="세전 금액">
<button class="save" onclick="addYearRecord()">연별 기록 추가</button>
</div>
</div>

<script>
var TAX_RATE = 0.055;
var appStarted = false;
var noticeTimer = null;

function toNum(v){ if(v==null) return 0; var n=parseInt(String(v).replace(/[^0-9-]/g,''),10); return isNaN(n)?0:n; }
function comma(n){ return toNum(n).toLocaleString(); }
function won(n){ return comma(n)+'원'; }
function netOf(g){ return Math.round(toNum(g)*(1-TAX_RATE)); }
function isDay(k){ return /^\d{4}-\d{2}-\d{2}$/.test(k); }
function nowParts(){
  var n=new Date();
  var y=n.getFullYear(), m=String(n.getMonth()+1).padStart(2,'0'), d=String(n.getDate()).padStart(2,'0');
  return { day:y+'-'+m+'-'+d, month:y+'-'+m, year:String(y), Y:y, M:n.getMonth()+1 };
}
function prevMonthKey(m){
  var y=parseInt(m.slice(0,4),10), mo=parseInt(m.slice(5),10);
  mo--; if(mo<1){ mo=12; y--; }
  return y+'-'+String(mo).padStart(2,'0');
}
function showNotice(msg,type){
  var el=document.getElementById('notice'); if(!el) return;
  el.innerText=msg; el.className=(type==='error'?'error':'success'); el.style.display='block';
  if(noticeTimer) clearTimeout(noticeTimer);
  noticeTimer=setTimeout(function(){ el.style.display='none'; el.className=''; },3500);
}

/* === 저장/삭제 === */
function saveDay(day){
  var g=toNum(document.getElementById('d_'+day).value);
  db.ref('history/'+day).set({ gross:g, net:netOf(g), updatedAt:new Date().toISOString() })
    .then(function(){ showNotice(day+' 저장 완료','success'); })
    .catch(function(e){ showNotice('저장 실패: '+e,'error'); });
}
function deleteDay(day){
  if(!confirm(day+' 기록을 삭제할까요?')) return;
  db.ref('history/'+day).remove().then(function(){ showNotice(day+' 삭제 완료','success'); });
}
function manualAdd(){
  var d=document.getElementById('manualDate').value;
  var g=toNum(document.getElementById('manualGross').value);
  if(!isDay(d)){ showNotice('날짜를 선택해 주세요.','error'); return; }
  db.ref('history/'+d).set({ gross:g, net:netOf(g), updatedAt:new Date().toISOString() })
    .then(function(){ showNotice(d+' 기록 추가 완료','success'); document.getElementById('manualGross').value=''; });
}

function saveMonth(m){
  var g=toNum(document.getElementById('m_'+m).value);
  db.ref('history/override_month/'+m).set({ gross:g, net:netOf(g), updatedAt:new Date().toISOString() })
    .then(function(){ showNotice(m+' 월별 저장(수정) 완료','success'); });
}
function clearMonth(m){
  if(!confirm(m+' 월별 수정값을 지우고 일별 합계로 되돌릴까요?')) return;
  db.ref('history/override_month/'+m).remove().then(function(){ showNotice(m+' 합계복원 완료','success'); });
}
function addMonthRecord(){
  var m=document.getElementById('addMonth').value;
  var g=toNum(document.getElementById('addMonthGross').value);
  if(!/^\d{4}-\d{2}$/.test(m)){ showNotice('월을 선택해 주세요.','error'); return; }
  db.ref('history/override_month/'+m).set({ gross:g, net:netOf(g), updatedAt:new Date().toISOString() })
    .then(function(){ showNotice(m+' 월별 기록 추가 완료','success'); document.getElementById('addMonthGross').value=''; });
}

function saveYear(y){
  var g=toNum(document.getElementById('y_'+y).value);
  db.ref('history/override_year/'+y).set({ gross:g, net:netOf(g), updatedAt:new Date().toISOString() })
    .then(function(){ showNotice(y+'년 연별 저장(수정) 완료','success'); });
}
function clearYear(y){
  if(!confirm(y+'년 연별 수정값을 지우고 월별 합계로 되돌릴까요?')) return;
  db.ref('history/override_year/'+y).remove().then(function(){ showNotice(y+'년 합계복원 완료','success'); });
}
function addYearRecord(){
  var y=String(document.getElementById('addYear').value||'').trim();
  var g=toNum(document.getElementById('addYearGross').value);
  if(!/^\d{4}$/.test(y)){ showNotice('연도를 4자리로 입력해 주세요.','error'); return; }
  db.ref('history/override_year/'+y).set({ gross:g, net:netOf(g), updatedAt:new Date().toISOString() })
    .then(function(){ showNotice(y+'년 연별 기록 추가 완료','success'); document.getElementById('addYearGross').value=''; });
}

/* === CSV 내보내기 === */
function exportCSV(){
  db.ref('history').once('value').then(function(snap){
    var d=snap.val()||{};
    var rows=[['날짜','구분','세전','세후']];
    Object.keys(d).filter(isDay).sort().forEach(function(k){
      rows.push([k,'일별',toNum(d[k].gross),netOf(d[k].gross)]);
    });
    var mo=d.override_month||{};
    Object.keys(mo).sort().forEach(function(m){ rows.push([m,'월별(수정)',toNum(mo[m].gross),netOf(mo[m].gross)]); });
    var yo=d.override_year||{};
    Object.keys(yo).sort().forEach(function(y){ rows.push([y,'연별(수정)',toNum(yo[y].gross),netOf(yo[y].gross)]); });
    var csv=rows.map(function(r){ return r.join(','); }).join('\n');
    var blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8;'});
    var url=URL.createObjectURL(blob);
    var a=document.createElement('a');
    a.href=url; a.download='수익기록_'+nowParts().day+'.csv';
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    showNotice('CSV 내려받기 완료','success');
  }).catch(function(e){ showNotice('CSV 실패: '+e,'error'); });
}

/* === 막대 그래프 === */
function renderChart(monthKey){
  var hist=window._hist||{};
  if(!monthKey){ var sel=document.getElementById('chartMonth'); monthKey=sel&&sel.value; }
  if(!monthKey){ document.getElementById('chart').innerHTML=''; document.getElementById('chartInfo').innerText=''; return; }
  var y=parseInt(monthKey.slice(0,4),10), mo=parseInt(monthKey.slice(5),10);
  var ndays=new Date(y,mo,0).getDate();
  var vals=[], total=0, maxv=1;
  for(var d=1; d<=ndays; d++){
    var key=monthKey+'-'+String(d).padStart(2,'0');
    var g=toNum(hist[key]&&hist[key].gross);
    vals.push(g); total+=g; if(g>maxv) maxv=g;
  }
  var html='';
  for(var i=0;i<vals.length;i++){
    var h=Math.round(vals[i]/maxv*100);
    html+='<div class="bcol"><div class="bwrap"><div class="bbar" style="height:'+h+'%" title="'+(i+1)+'일: '+comma(vals[i])+'원"></div></div><div class="bday">'+(i+1)+'</div></div>';
  }
  document.getElementById('chart').innerHTML=html;
  var avg=ndays>0?Math.round(total/ndays):0;
  document.getElementById('chartInfo').innerText=monthKey+' 합계 '+won(total)+' · 일평균 '+won(avg);
}

/* === 메인 렌더 === */
function render(data){
  // 편집 중이면 입력 보호
  if(document.activeElement && document.activeElement.classList && document.activeElement.classList.contains('edit')) return;

  data=data||{};
  window._hist=data;
  var monthOv=data.override_month||{};
  var yearOv=data.override_year||{};
  var cur=nowParts();

  // 일별 → 월별 합계
  var days=[], monthMap={};
  Object.keys(data).forEach(function(k){
    if(!isDay(k)) return;
    var g=toNum(data[k]&&data[k].gross);
    days.push(k);
    monthMap[k.slice(0,7)]=(monthMap[k.slice(0,7)]||0)+g;
  });
  days.sort().reverse();

  function monthTotal(m){ return (monthOv[m]!=null)?toNum(monthOv[m].gross):(monthMap[m]||0); }

  // 표시할 월 목록: 올해 1~현재월 + 데이터 있는 달
  var monthSet={};
  for(var mm=1; mm<=cur.M; mm++){ monthSet[cur.year+'-'+String(mm).padStart(2,'0')]=true; }
  Object.keys(monthMap).forEach(function(m){ monthSet[m]=true; });
  Object.keys(monthOv).forEach(function(m){ monthSet[m]=true; });
  var monthList=Object.keys(monthSet).sort().reverse();

  function yearTotal(y){
    if(yearOv[y]!=null) return toNum(yearOv[y].gross);
    var t=0; Object.keys(monthSet).forEach(function(m){ if(m.indexOf(y)===0) t+=monthTotal(m); });
    return t;
  }

  // 표시할 연도: 최근 3년 + 데이터 있는 연도
  var yearSet={};
  for(var yy=cur.Y-2; yy<=cur.Y; yy++) yearSet[String(yy)]=true;
  Object.keys(monthSet).forEach(function(m){ yearSet[m.slice(0,4)]=true; });
  Object.keys(yearOv).forEach(function(y){ yearSet[y]=true; });
  var yearList=Object.keys(yearSet).sort().reverse();

  // 상단 카드
  var todayG=toNum(data[cur.day]&&data[cur.day].gross);
  setCard('cToday', todayG);
  setCard('cMonth', monthTotal(cur.month));
  setCard('cYear', yearTotal(cur.year));

  // 일별 표
  var db1='';
  if(days.length===0){ db1='<tr><td colspan="4" style="text-align:center;color:#888">기록 없음</td></tr>'; }
  days.forEach(function(k){
    var g=toNum(data[k].gross);
    db1+='<tr><td>'+k+'</td>'
      +'<td><input class="edit" id="d_'+k+'" type="text" inputmode="numeric" value="'+comma(g)+'"></td>'
      +'<td>'+won(netOf(g))+'</td>'
      +'<td class="center"><button class="save" onclick="saveDay(\''+k+'\')">저장</button>'
      +'<button class="del" onclick="deleteDay(\''+k+'\')">삭제</button></td></tr>';
  });
  document.getElementById('dailyBody').innerHTML=db1;

  // 월별 표 (전월대비 포함)
  var mb='';
  monthList.forEach(function(m){
    var ov=(monthOv[m]!=null);
    var g=monthTotal(m);
    var prev=prevMonthKey(m);
    var pv=monthTotal(prev);
    var hasPrev=(monthSet[prev]===true) && pv>0;
    var chg='<span class="flat">–</span>';
    if(hasPrev){
      var diff=Math.round((g-pv)/pv*100);
      if(diff>0) chg='<span class="up">▲'+diff+'%</span>';
      else if(diff<0) chg='<span class="down">▼'+Math.abs(diff)+'%</span>';
      else chg='<span class="flat">0%</span>';
    }
    mb+='<tr><td>'+m+(ov?'<span class="ovtag">수정됨</span>':'')+'</td>'
      +'<td><input class="edit" id="m_'+m+'" type="text" inputmode="numeric" value="'+comma(g)+'"></td>'
      +'<td>'+won(netOf(g))+'</td>'
      +'<td class="center">'+chg+'</td>'
      +'<td class="center"><button class="save" onclick="saveMonth(\''+m+'\')">저장</button>'
      +(ov?'<button class="del" onclick="clearMonth(\''+m+'\')">합계복원</button>':'')+'</td></tr>';
  });
  document.getElementById('monthBody').innerHTML=mb;

  // 연별 표
  var yb='';
  yearList.forEach(function(y){
    var ov=(yearOv[y]!=null);
    var g=yearTotal(y);
    yb+='<tr><td>'+y+'년'+(ov?'<span class="ovtag">수정됨</span>':'')+'</td>'
      +'<td><input class="edit" id="y_'+y+'" type="text" inputmode="numeric" value="'+comma(g)+'"></td>'
      +'<td>'+won(netOf(g))+'</td>'
      +'<td class="center"><button class="save" onclick="saveYear(\''+y+'\')">저장</button>'
      +(ov?'<button class="del" onclick="clearYear(\''+y+'\')">합계복원</button>':'')+'</td></tr>';
  });
  document.getElementById('yearBody').innerHTML=yb;

  // 그래프 월 선택지: 데이터 있는 달 + 이번 달
  var chartSet={};
  Object.keys(monthMap).forEach(function(m){ chartSet[m]=true; });
  chartSet[cur.month]=true;
  var chartMonths=Object.keys(chartSet).sort().reverse();
  var selEl=document.getElementById('chartMonth');
  var prevSel=selEl.value;
  selEl.innerHTML=chartMonths.map(function(m){ return '<option value="'+m+'">'+m+'</option>'; }).join('');
  selEl.value=(chartMonths.indexOf(prevSel)>-1)?prevSel:cur.month;
  renderChart(selEl.value);
}

function setCard(idBase, g){
  document.getElementById(idBase).innerText=won(g);
  document.getElementById(idBase+'Net').innerText='세후 '+won(netOf(g));
}

/* === 로그인 / 시작 === */
function doLogin(){
  firebase.auth().signInWithEmailAndPassword(
    document.getElementById('authEmail').value,
    document.getElementById('authPw').value
  ).catch(function(e){ document.getElementById('authMsg').innerText='로그인 실패: '+e.message; });
}
function initApp(){
  if(appStarted) return; appStarted=true;
  db.ref('history').on('value', function(snap){ render(snap.val()); });
}
firebase.auth().onAuthStateChanged(function(user){
  if(user){ document.getElementById('authGate').style.display='none'; initApp(); }
  else { document.getElementById('authGate').style.display='flex'; }
});
</script>

</body>
</html>
